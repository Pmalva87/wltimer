name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `npm run build` is `tsc && vite build`: type-checks the frontend, then
      # confirms it bundles. This is the only automated check the TypeScript
      # in src/ gets — there is no frontend test suite.
      - run: npm run build

  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # src-tauri links against the system webview; the core crate alone would
      # not need these, but `--workspace` compiles both.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Pinned rather than `stable` so a new Rust release can't turn this red on
      # its own schedule: clippy gains lints every six weeks, and CI running a
      # newer toolchain than the developer means "green locally" stops meaning
      # anything. Deliberately NOT a rust-toolchain.toml — that would apply
      # locally too and strand the Android targets installed against `stable`.
      # Bump this by hand, together with a local `rustup update`.
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # --locked fails the build if Cargo.lock would need updating.
      - run: cargo test --workspace --locked

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
