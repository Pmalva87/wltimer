[package]
name = "wltimer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }
# No `clock` feature on purpose: core formats and compares timestamps but never
# reads the wall clock, so `Utc::now()` will not compile here. See `time`.
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
